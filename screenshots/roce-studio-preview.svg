  <text x="630" y="480" font-family="monospace" font-size="11" fill="#38bdf8">qos map dscp 26 to traffic-class 3</text>
  <text x="630" y="500" font-family="monospace" font-size="11" fill="#38bdf8">priority-flow-control</text>
  <text x="650" y="520" font-family="monospace" font-size="11" fill="#38bdf8">priority 3 no-drop</text>
  <text x="630" y="540" font-family="monospace" font-size="11" fill="#38bdf8">pfc watchdog</text>
  <text x="650" y="560" font-family="monospace" font-size="11" fill="#38bdf8">timeout 100 ms action drop</text>
  <text x="630" y="580" font-family="monospace" font-size="11" fill="#38bdf8">interface Ethernet1/1-32</text>
  <text x="650" y="600" font-family="monospace" font-size="11" fill="#38bdf8">mtu 9216; qos profile ROCE_LOSSLESS_PROFILE</text>
